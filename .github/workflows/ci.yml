name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    name: Sim core + calibration sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure (no viewer)
        run: cmake -S . -B build -DNHL_SIM_VIEWER=OFF
      - name: Build
        run: cmake --build build -j
      - name: 100-game sanity check
        run: ./build/headless_sim data 100 --check
      - name: Single box score and ratings
        run: |
          ./build/headless_sim data --box EDM COL
          ./build/headless_sim data --ratings

  viewer:
    name: Viewer build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install raylib build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Render screenshots on a virtual display (2D and each 3D camera)
        if: runner.os == 'Linux'
        run: |
          for v in 2d 3d wide end; do
            xvfb-run -a -s "-screen 0 1600x1000x24" \
              ./build/nhl_sim --data data --home EDM --away COL --screenshot shot-$v.png --after 600 --view $v
            test -s shot-$v.png
          done
      - name: Scripted live game (V, C, zoom, names, 30x, back to 2D)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            ./build/nhl_sim --data data --home EDM --away COL --script-out shot-live \
            --script "1:v,1.5:shot,2:c,3:shot,3.5:c,4.5:shot,5:c,5.1:z+5,6:shot,6.5:n,6.6:s5,8:shot,8.5:v,9:shot,9.5:quit"
          for i in 1 2 3 4 5 6; do test -s shot-live_$i.png; done
      - name: Upload screenshots
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: viewer-screenshots
          path: shot-*.png
